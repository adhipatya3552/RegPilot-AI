services:
  - type: web
    name: regpilot-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: FIREWORKS_API_KEY
        sync: false
      - key: FIREWORKS_BASE_URL
        value: https://api.fireworks.ai/inference/v1
      - key: ALLOWED_MODELS
        value: accounts/fireworks/models/deepseek-v4-flash
